name: Deploy Azure Containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: canadaeast
      APP_SERVICE_PLAN: ${{ secrets.APP_SERVICE_PLAN }}

      ACR_NAME: ${{ secrets.ACR_NAME }}
      WEB_CLIENT_APP_NAME: ${{ secrets.WEB_CLIENT_APP_NAME }}
      EXAMPLE_SERVER_APP_NAME: ${{ secrets.EXAMPLE_SERVER_APP_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate required secrets
        shell: bash
        env:
          ACR_ADMINUSER: ${{ secrets.ACR_ADMINUSER }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0

          for var in AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP ACR_NAME WEB_CLIENT_APP_NAME EXAMPLE_SERVER_APP_NAME; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing secret::${var} is required"
              missing=1
            fi
          done

          if [ -z "${ACR_ADMINUSER:-}" ]; then
            echo "::error title=Missing secret::ACR_ADMINUSER is required"
            missing=1
          fi
          if [ -z "${ACR_PASSWORD:-}" ]; then
            echo "::error title=Missing secret::ACR_PASSWORD is required"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set subscription
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az account show -o table

      - name: Resolve ACR login server (source of truth) + mask
        shell: bash
        run: |
          set -euo pipefail
          LOGIN_SERVER="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)"
          if [ -z "$LOGIN_SERVER" ]; then
            echo "::error title=ACR Not Found::Could not resolve loginServer for ACR_NAME=$ACR_NAME"
            exit 1
          fi
          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "::add-mask::$LOGIN_SERVER"

      - name: Docker login to ACR (admin user)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_ADMINUSER }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push web client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web_client/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/calendar-web:${{ env.IMAGE_TAG }}

      - name: Build and push example server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: example_server/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/calendar-example:${{ env.IMAGE_TAG }}

      - name: Ensure resource group exists (Canada East)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az group show -n "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1 || \
              az group create -n "$AZURE_RESOURCE_GROUP" -l "$AZURE_LOCATION" -o none

      - name: Ensure App Service plan exists (Linux, Canada East)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            if az appservice plan show -g "$AZURE_RESOURCE_GROUP" -n "$APP_SERVICE_PLAN" >/dev/null 2>&1; then
              echo "App Service plan exists: $APP_SERVICE_PLAN"
            else
              # Adjust SKU as needed: B1 (cheaper), S1 (safer), P1v3 (production).
              az appservice plan create \
                -g "$AZURE_RESOURCE_GROUP" \
                -n "$APP_SERVICE_PLAN" \
                --is-linux \
                --sku B1 \
                -l "$AZURE_LOCATION" \
                -o none
              echo "Created App Service plan: $APP_SERVICE_PLAN"
            fi

      - name: Ensure web apps exist (Linux)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            ensure_webapp () {
              local APP_NAME="$1"

              if az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$APP_NAME" >/dev/null 2>&1; then
                echo "Web app exists: $APP_NAME"
              else
                az webapp create \
                  -g "$AZURE_RESOURCE_GROUP" \
                  -p "$APP_SERVICE_PLAN" \
                  -n "$APP_NAME" \
                  --runtime "NODE|20-lts" \
                  -o none

                # Put the app into Linux container mode; actual image is set in the next steps.
                az webapp config set \
                  -g "$AZURE_RESOURCE_GROUP" \
                  -n "$APP_NAME" \
                  --linux-fx-version "DOCKER|${ACR_LOGIN_SERVER}/placeholder:latest" \
                  -o none

                echo "Created web app: $APP_NAME"
              fi
            }

            ensure_webapp "$WEB_CLIENT_APP_NAME"
            ensure_webapp "$EXAMPLE_SERVER_APP_NAME"

      - name: Configure web client container + registry credentials
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            az webapp config container set \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --container-image-name "${ACR_LOGIN_SERVER}/calendar-web:${IMAGE_TAG}" \
              --docker-registry-server-url "https://${ACR_LOGIN_SERVER}" \
              --docker-registry-server-user "${{ secrets.ACR_ADMINUSER }}" \
              --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}" \
              --enable-app-service-storage false

            az webapp config appsettings set \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --settings WEBSITES_PORT=80

            az webapp update \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set healthCheckPath="/healthz"

      - name: Configure example server container + registry credentials
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            az webapp config container set \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --container-image-name "${ACR_LOGIN_SERVER}/calendar-example:${IMAGE_TAG}" \
              --docker-registry-server-url "https://${ACR_LOGIN_SERVER}" \
              --docker-registry-server-user "${{ secrets.ACR_ADMINUSER }}" \
              --docker-registry-server-password "${{ secrets.ACR_PASSWORD }}" \
              --enable-app-service-storage false

            az webapp config appsettings set \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --settings WEBSITES_PORT=8080

            az webapp update \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set healthCheckPath="/readyz"
