name: Deploy Azure Containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}                 # e.g. "myregistry" (NOT the full FQDN)
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }} # e.g. "myregistry.azurecr.io"
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      WEB_CLIENT_APP_NAME: ${{ secrets.WEB_CLIENT_APP_NAME }}
      EXAMPLE_SERVER_APP_NAME: ${{ secrets.EXAMPLE_SERVER_APP_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in ACR_NAME ACR_LOGIN_SERVER AZURE_RESOURCE_GROUP WEB_CLIENT_APP_NAME EXAMPLE_SERVER_APP_NAME; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing secret::${var} is required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Resolve ACR login server (source of truth) + mask
        shell: bash
        run: |
          set -euo pipefail
          # Prefer Azure as source of truth in case the secret is wrong or includes whitespace.
          LOGIN_SERVER="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)"
          if [ -z "$LOGIN_SERVER" ]; then
            echo "::error title=ACR Not Found::Could not resolve loginServer for ACR_NAME=$ACR_NAME"
            exit 1
          fi
          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"
          echo "::add-mask::$LOGIN_SERVER"

      - name: ACR docker login (token)
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az acr login -n "$ACR_NAME" --expose-token --query accessToken -o tsv)"
          if [ -z "$TOKEN" ]; then
            echo "::error title=ACR Token Error::Failed to obtain ACR access token. Check AcrPull/AcrPush role on the registry."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          # Username is ignored for AAD access tokens; this placeholder is standard.
          echo "$TOKEN" | docker login "$ACR_LOGIN_SERVER" -u 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build and push web client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web_client/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/calendar-web:${{ env.IMAGE_TAG }}

      - name: Build and push example server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: example_server/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/calendar-example:${{ env.IMAGE_TAG }}

      - name: Deploy web client container
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp config container set \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --docker-custom-image-name "${ACR_LOGIN_SERVER}/calendar-web:${IMAGE_TAG}" \
              --enable-app-service-storage false
            az webapp config appsettings set \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --settings WEBSITES_PORT=80
            az webapp update \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set healthCheckPath="/healthz"

      - name: Deploy example server container
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp config container set \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --docker-custom-image-name "${ACR_LOGIN_SERVER}/calendar-example:${IMAGE_TAG}" \
              --enable-app-service-storage false
            az webapp config appsettings set \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --settings WEBSITES_PORT=8080
            az webapp update \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set healthCheckPath="/readyz"
