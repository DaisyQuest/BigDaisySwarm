name: Deploy Azure Containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ACR_NAME: ${{ secrets.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      WEB_CLIENT_APP_NAME: ${{ secrets.WEB_CLIENT_APP_NAME }}
      EXAMPLE_SERVER_APP_NAME: ${{ secrets.EXAMPLE_SERVER_APP_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate required secrets
        run: |
          missing=0
          for var in ACR_NAME ACR_LOGIN_SERVER AZURE_RESOURCE_GROUP WEB_CLIENT_APP_NAME EXAMPLE_SERVER_APP_NAME; do
            if [ -z "${!var}" ]; then
              echo "::error title=Missing secret::${var} is required";
              missing=1;
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "$ACR_NAME" --only-show-errors
          echo "::add-mask::${ACR_LOGIN_SERVER}"

      - name: Build and push web client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web_client/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/calendar-web:${{ env.IMAGE_TAG }}

      - name: Build and push example server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: example_server/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/calendar-example:${{ env.IMAGE_TAG }}

      - name: Deploy web client container
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --docker-custom-image-name "${ACR_LOGIN_SERVER}/calendar-web:${IMAGE_TAG}" \
              --enable-app-service-storage false
            az webapp config appsettings set \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --settings WEBSITES_PORT=80
            az webapp update \
              --name "$WEB_CLIENT_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set healthCheckPath="/healthz"

      - name: Deploy example server container
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --docker-custom-image-name "${ACR_LOGIN_SERVER}/calendar-example:${IMAGE_TAG}" \
              --enable-app-service-storage false
            az webapp config appsettings set \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --settings WEBSITES_PORT=8080
            az webapp update \
              --name "$EXAMPLE_SERVER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --set healthCheckPath="/readyz"
