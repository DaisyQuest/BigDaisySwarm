name: RPS Arena CI

on:
  push:
    paths:
      - "RPSArena/**"
      - ".github/workflows/rpsarena.yml"
  pull_request:
    paths:
      - "RPSArena/**"
      - ".github/workflows/rpsarena.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RPSArena
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test

  deploy:
    needs: test
    # Only attempt deploy on pushes (never on PRs)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RPSArena
    env:
      # Pull secrets into env so we can test presence in bash safely.
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      # If you are using the long autogenerated secret name instead, set this env
      # and use it below (or replace the line above with that secret).
      AZURE_WEBAPP_PUBLISH_PROFILE_LONG: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9CAF822723A946CE9D2080122B5832BF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to deploy
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          # Prefer AZURE_WEBAPP_PUBLISH_PROFILE if present; otherwise fall back to the long secret.
          PROFILE="${AZURE_WEBAPP_PUBLISH_PROFILE:-}"
          if [ -z "$PROFILE" ]; then
            PROFILE="${AZURE_WEBAPP_PUBLISH_PROFILE_LONG:-}"
          fi

          if [ -z "$PROFILE" ]; then
            echo "will_deploy=false" >> "$GITHUB_OUTPUT"
            echo "No publish profile secret set; skipping deploy."
            exit 0
          fi

          echo "will_deploy=true" >> "$GITHUB_OUTPUT"
          # Mask profile content and pass it along via output (safe enough for actions usage)
          echo "::add-mask::$PROFILE"
          echo "publish_profile=$PROFILE" >> "$GITHUB_OUTPUT"

          # App name default
          APP_NAME="${AZURE_WEBAPP_NAME:-rps-arena}"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.gate.outputs.will_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install production dependencies
        if: steps.gate.outputs.will_deploy == 'true'
        run: npm ci --omit=dev

      - name: Archive application
        if: steps.gate.outputs.will_deploy == 'true'
        run: zip -r release.zip . -x "node_modules/*" "coverage/*"

      - name: Deploy to Azure Web App
