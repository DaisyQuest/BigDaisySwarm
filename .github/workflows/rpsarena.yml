name: RPS Arena CI

on:
  push:
    paths:
      - "RPSArena/**"
      - ".github/workflows/rpsarena.yml"
  pull_request:
    paths:
      - "RPSArena/**"
      - ".github/workflows/rpsarena.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RPSArena
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        run: npm test

  deploy:
    needs: test
    if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RPSArena
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Archive application
        run: zip -r release.zip . -x "node_modules/*" "coverage/*"
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME || 'rps-arena' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: RPSArena/release.zip
