[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigdaisyswarm"
version = "0.1.0"
description = "Agent coordination toolkit for project specs, meetings, and team configuration"
readme = "README.md"
authors = [{name = "Big Daisy Swarm Team"}]
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2,<3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers --strict-config"
